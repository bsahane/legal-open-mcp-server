[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legal_mcp_server"]

[project]
name = "legal-mcp-server"
version = "0.1.0"
description = "An MCP server that acts as a personal legal research, drafting, and matter-management assistant for Indian law"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["mcp", "legal", "india", "law", "fastmcp", "fastapi"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==2.14.2",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "structlog==25.4.0",
    "python-dotenv==1.1.1",
    "fastapi==0.116.0",
    "uvicorn==0.35.0",
    "asyncpg==0.30.0",
    "psycopg==3.2.3",
    "itsdangerous==2.2.0",
    "requests-oauthlib==2.0.0",
    # --- Legal MCP Server additions ---
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "jinja2==3.1.4",
    "python-dateutil==2.9.0.post0",
    "rapidfuzz==3.10.1",
    "pgvector==0.3.6",
    "pyyaml==6.0.2",
    "beautifulsoup4==4.12.3",
    # Queries the free open-data judgment corpus (Parquet) locally.
    "duckdb==1.5.5",
]

[project.optional-dependencies]
# Embedding backends are optional: without either, hybrid search degrades to
# Postgres full-text only (EMBEDDING_PROVIDER=disabled).
voyage = ["voyageai==0.5.0"]
local = ["fastembed==0.4.2"]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.2",
    "mypy==1.16.1",
    "pre-commit==4.2.0",
    "httpx==0.28.1",
    "langchain-google-genai==2.1.8",
    "langchain_mcp_adapters==0.1.8",
    "langgraph==0.5.4",
    "bandit==1.9.3",
    "types-PyYAML",
    "types-python-dateutil",
    "safety",
    "pydocstyle"
]

[project.scripts]
legal-mcp-server = "legal_mcp_server.src.main:main"

[project.urls]
Homepage = "https://github.com/redhat-data-and-ai/legal-mcp-server"
Repository = "https://github.com/redhat-data-and-ai/legal-mcp-server"
Issues = "https://github.com/redhat-data-and-ai/legal-mcp-server/issues"
Changelog = "https://github.com/redhat-data-and-ai/legal-mcp-server/releases"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "W", "F", "I"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["legal_mcp_server"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = ["asyncio"]

[tool.coverage.run]
source = ["legal_mcp_server"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
