apiVersion: v1
kind: Secret
metadata:
  name: legal-mcp-server-secrets
  labels:
    app: legal-mcp-server
    component: mcp-server
type: Opaque
stringData:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME_GENERATE_SECURE_RANDOM_KEY"
  # SSO_CLIENT_ID: ""
  # SSO_CLIENT_SECRET: ""

  # --- Legal MCP Server ---
  # Indian Kanoon API token (https://api.indiankanoon.org/). Without it, case
  # law search and case-citation verification report themselves as unavailable
  # rather than returning results.
  INDIAN_KANOON_API_KEY: ""
  # Voyage AI key, only needed when EMBEDDING_PROVIDER=voyage.
  VOYAGE_API_KEY: ""
  # Licensed third-party court-data provider key, only needed when
  # ECOURTS_ADAPTER=api.
  ECOURTS_API_KEY: ""
