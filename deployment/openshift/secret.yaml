apiVersion: v1
kind: Secret
metadata:
  name: legal-mcp-server-secrets
  labels:
    app: legal-mcp-server
    component: mcp-server
type: Opaque
stringData:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME_GENERATE_SECURE_RANDOM_KEY"
  # SSO_CLIENT_ID: ""
  # SSO_CLIENT_SECRET: ""

  # --- Legal MCP Server ---
  # Paid Indian Kanoon token, needed ONLY if you set
  # CASE_LAW_SOURCE=indian_kanoon. The default open-data backend is free and
  # needs no key, so leave this blank.
  INDIAN_KANOON_API_KEY: ""
  # Voyage AI key, only needed when EMBEDDING_PROVIDER=voyage.
  VOYAGE_API_KEY: ""
  # Licensed third-party court-data provider key, only needed when
  # ECOURTS_ADAPTER=api.
  ECOURTS_API_KEY: ""
