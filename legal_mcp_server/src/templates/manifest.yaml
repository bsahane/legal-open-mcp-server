      - sender_address
      - notice_date
      - recipient_name
      - recipient_address
      - subject
      - client_name
      - client_address
      - facts
      - legal_basis
      - demands
      - compliance_days
      - proposed_proceedings
    optional:
      - reference
      - sender_phone
      - sender_email
      - send_by_email
      - prior_attempts
      - advocate_name
      - advocate_enrolment
    checklist:
      - Facts are pleaded chronologically and are capable of proof
      - Legal basis identifies the provision or duty breached
      - Demands are specific, quantified and capable of compliance
      - Compliance period is reasonable for what is demanded
      - Claim is within limitation - compute it before sending
      - Where the addressee is a government body, section 80 CPC requires two months' notice
    authority: general; see section 80 CPC where the Government is the addressee

  - key: reply_to_notice
    file: reply_to_notice.j2
    title: Reply to a legal notice
    category: notice
    description: >
      Point-by-point reply denying allegations, stating the true facts and
      raising defences, with rights reserved. Available in English and Hindi.
    languages:
      - en
      - hi
    required:
      - sender_name
      - sender_address
      - reply_date
      - recipient_name
      - recipient_address
      - original_notice_date
      - client_name
      - client_address
      - paragraph_responses
      - true_facts
    optional:
      - reference
      - original_reference
      - legal_defences
      - counter_demands
      - advocate_name
      - advocate_enrolment
    checklist:
      - Every material allegation is specifically traversed - a general denial is weak
      - Nothing is admitted inadvertently
      - Limitation, jurisdiction and maintainability are raised if available
      - Reply is sent within any period the notice specified
      - Rights and contentions are expressly reserved

  - key: consumer_complaint
    file: consumer_complaint.j2
    title: Complaint under the Consumer Protection Act, 2019
    category: pleading
    description: >
      Complaint to a District, State or National Commission, with
      verification. Available in English and Hindi.
    languages:
      - en
      - hi
    required:
      - forum_name
      - forum_place
      - filing_year
      - filing_date
      - complainant_name
      - complainant_address
      - opposite_party_name
      - opposite_party_address
      - consumer_basis
      - opposite_party_description
      - transaction_date
      - transaction_description
      - amount_paid
      - facts
      - cause_of_action_date
      - jurisdiction_basis
      - reliefs
    optional:
      - service_complaint
      - advocate_name
    checklist:
      - Complainant is a consumer under s.2(7) - goods or services for a commercial purpose are excluded
      - Filed within two years of the cause of action (s.69)
      - Pecuniary jurisdiction matches the consideration paid, not the relief claimed
      - Territorial jurisdiction pleaded under s.34(2)
      - Reliefs are within what s.39 empowers the Commission to grant
      - Verification is signed and dated
    authority: sections 2(7), 34, 35 and 69, Consumer Protection Act, 2019

  - key: rti_application
    file: rti_application.j2
    title: Application under the Right to Information Act, 2005
    category: application
    description: >
      Request for information from a public authority, with fee and
      severability requests.
    required:
      - public_authority
      - authority_address
      - application_date
      - information_sought
      - applicant_name
      - applicant_address
    optional:
      - period_covered
      - fee_mode
      - fee_reference
      - bpl
      - life_and_liberty
      - delivery_mode
      - applicant_phone
      - applicant_email
    checklist:
      - Each item sought is specific - a request for "all information" invites rejection
      - No reasons for the request are given; s.6(2) does not require them
      - Fee of Rs 10 is paid, or BPL exemption claimed with certificate
      - Addressed to the PIO of the correct public authority
      - Diarise 30 days for the response, and the first appeal thereafter
    authority: sections 6, 7 and 19, Right to Information Act, 2005
    next_steps:
      - If no reply within 30 days, that is a deemed refusal - first appeal lies within 30 days thereafter (s.19(1))
      - Second appeal to the Information Commission within 90 days (s.19(3))

