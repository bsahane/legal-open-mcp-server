  - key: notice_hmp13
    file: notice_hmp13.j2
    title: Notice under Section 13(1) Haryana Municipal Act
    category: notice
    description: >
      Notice under Section 13(1) of the Haryana Municipal Act / relevant
      Municipal Act for building/construction violations. Matches advocate
      letterhead format with separators and bilingual support. Available
      in English and Hindi.
    languages:
      - en
      - hi
    required:
      - notice_date
      - violation_date
      - recipient_name
      - recipient_address
      - client_name
      - client_address
      - facts
    optional:
      - branding
    branding_params:
      - advocate_name
      - enrollment
      - firm_name
      - office_address
      - mobile
      - email
      - logo_base64
      - separator_style
      - date_format
    checklist:
      - Violation is within municipal jurisdiction
      - Notice specifies the exact violation and provision
      - Reasonable time given for compliance
      - Sent by registered post AD; retain receipt
    authority: Section 13(1), Haryana Municipal Act / relevant Municipal Act
